name: Release

# Credentials: nuget.org trusted publishing. The publish job trades the run's GitHub OIDC token for an nuget.org API key
# that lasts an hour, so no long-lived key is stored. It needs a trusted publishing policy on nuget.org for this
# repository, the workflow file release.yml and the `release` environment, and NUGET_USER, a secret on that environment
# holding the nuget.org profile name (not the email address) of the policy's owner. On a private repository the policy
# is only temporarily active until its first publish, and lapses if nothing publishes within 7 days of creating or
# restarting it.

on:
  push:
    tags: ['v*']
  # Rehearses a release: with dry_run left on, the whole pipeline runs and the publish job prints what it would push
  # and release instead of doing it.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would be published instead of publishing it
        type: boolean
        default: true
      version:
        description: The version to build, such as 0.1.0-rc.1; required to publish, and a dry run defaults to Version
        type: string
        default: ''

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  check:
    # The tag names the version: v0.1.0-rc.1 builds, packs and publishes 0.1.0-rc.1, whatever Version in
    # Directory.Build.props says, so releasing needs no commit to bump it. A dispatch has no tag: one that publishes
    # names its version in the `version` input and must not find its tag already pushed, since gh release create
    # would then bind this run's packages and archives to whatever commit the old tag names; a rehearsal defaults to
    # Version in Directory.Build.props and is free to run at any version. The release takes its notes from a
    # CHANGELOG.md section, so one must exist: the version's own for a stable version, and for a prerelease (a version
    # with a "-", such as 0.1.0-rc.1) its own if there is one, else "Unreleased", so prereleases need no section of
    # their own. A rehearsal checks this too, so it catches a missing section before the tag does.
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      notes_section: ${{ steps.version.outputs.notes_section }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Work out the version from the tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            version=${REF_NAME#v}
          elif [ -n "$INPUT_VERSION" ]; then
            version=$INPUT_VERSION
          elif [ "$DRY_RUN" = true ]; then
            version=$(dotnet msbuild src/Hippo -getProperty:Version | tr -d '\r')
          else
            echo "::error::A dispatch that publishes needs the version input."
            exit 1
          fi
          # SemVer without build metadata: NuGet drops what follows a "+", so a package and its tag would disagree.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::\"$version\" is not a version such as 0.1.0 or 0.1.0-rc.1; tag v<version>."
            exit 1
          fi
          tag="v$version"
          if [ "$EVENT_NAME" != push ] && [ "$DRY_RUN" != true ] \
            && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists; a dispatch publishes only a version that has not been tagged yet."
            exit 1
          fi
          # A heading is "## <name>" or "## [<name>]", alone or followed by " - <date>". The name is compared as a
          # string, not a pattern, so 0.1.0 matches neither 0.1.01 nor 0x1y0.
          has_section() {
            awk -v v="$1" '$1 == "##" && ($2 == v || $2 == "[" v "]") && (NF == 2 || $3 == "-") { found = 1 }
              END { exit !found }' CHANGELOG.md
          }
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          if has_section "$version"; then
            section=$version
          elif [ "$prerelease" = true ] && has_section Unreleased; then
            section=Unreleased
          elif [ "$prerelease" = true ]; then
            echo "::error::CHANGELOG.md has neither a heading for $version nor an \"## Unreleased\" section."
            exit 1
          else
            echo "::error::CHANGELOG.md has no heading for $version;" \
              "rename \"## Unreleased\" to \"## $version - <date>\"."
            exit 1
          fi
          echo "Version $version, tag $tag, prerelease $prerelease, notes from the \"$section\" section"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "notes_section=$section" >> "$GITHUB_OUTPUT"

  ci:
    # The same pipeline as on main, so every package and binary published here was packed, installed and E2E-tested.
    name: CI
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.check.outputs.version }}

  publish:
    name: Publish
    needs: [check, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The required reviewer on this environment approves each publish, a rehearsal included.
    environment: release
    permissions:
      contents: write
      # Lets the job request the OIDC token that NuGet/login trades for an API key.
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      NOTES_SECTION: ${{ needs.check.outputs.notes_section }}
      # A tag push has no inputs, so it always publishes.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      # The RIDs with a native binary, win-x64 aside, which ships hippo.exe in a zip. Must match the `native` matrix in
      # ci.yml, ToolPackageRuntimeIdentifiers in src/Hippo/Hippo.csproj and the Distribution section of README.md.
      NATIVE_RIDS: osx-arm64 osx-x64 linux-x64 linux-musl-x64
    steps:
      # gh release create reads the repository from the checkout; setup-dotnet reads global.json from it.
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: tool-package
          path: artifacts/nupkg

      # Each binary lands in artifacts/bin/hippo-<rid>/.
      - uses: actions/download-artifact@v8
        with:
          pattern: hippo-*
          path: artifacts/bin

      # Artifacts do not keep file modes, so the binaries are made executable again before they are archived. Each
      # archive holds the binary alone, at its root, so unpacking it gives the command directly.
      - name: Archive the binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          for rid in $NATIVE_RIDS; do
            test -f "artifacts/bin/hippo-$rid/hippo" || { echo "::error::No hippo binary for $rid."; exit 1; }
            chmod +x "artifacts/bin/hippo-$rid/hippo"
            tar -czf "artifacts/release/hippo-$VERSION-$rid.tar.gz" -C "artifacts/bin/hippo-$rid" hippo
          done
          test -f artifacts/bin/hippo-win-x64/hippo.exe || { echo "::error::No hippo.exe binary for win-x64."; exit 1; }
          zip -j "artifacts/release/hippo-$VERSION-win-x64.zip" artifacts/bin/hippo-win-x64/hippo.exe

      # The release notes are the CHANGELOG.md section the check job chose: the lines after its heading, matched as the
      # check job matches it, up to the next "## " heading, with blank lines trimmed from both ends. They are written
      # before the first push, so a section with no text stops the run before anything is published.
      - name: Write the release notes
        shell: bash
        run: |
          set -euo pipefail
          awk -v v="$NOTES_SECTION" '
            $1 == "##" { if (found) exit; found = ($2 == v || $2 == "[" v "]") && (NF == 2 || $3 == "-"); next }
            !found { next }
            NF == 0 { if (started) blanks++; next }
            { for (; blanks > 0; blanks--) print ""; print; started = 1 }
          ' CHANGELOG.md > artifacts/release-notes.md
          if [ ! -s artifacts/release-notes.md ]; then
            echo "::error::The CHANGELOG.md section \"$NOTES_SECTION\" is empty; the release needs its notes."
            exit 1
          fi

      # The key lasts an hour, so it is requested just before the push. A rehearsal publishes nothing and skips it.
      - name: Log in to nuget.org
        id: login
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The package users install names the native packages and hippo.any, and installing it fails until the one the
      # CLI picks is on nuget.org, so it goes last. Every file is checked before the first push, so a missing one stops
      # the run before a partial push. --skip-duplicate lets a rerun after a partial failure resume.
      - name: Push the packages to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          files=()
          for id in $NATIVE_RIDS win-x64 any; do
            files+=("artifacts/nupkg/hippo.$id.$VERSION.nupkg")
          done
          files+=("artifacts/nupkg/hippo.$VERSION.nupkg")
          for file in "${files[@]}"; do
            test -f "$file" || { echo "::error::$file is missing."; exit 1; }
          done
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: would push, in this order:"
            printf '  %s\n' "${files[@]}"
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "Pushing $file"
            dotnet nuget push "$file" --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      # --target matters only on a dispatch, where the tag does not exist yet: gh would otherwise tag the default
      # branch rather than the commit this run tested. A prerelease is marked as one, so it never becomes "Latest".
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archives=()
          for rid in $NATIVE_RIDS; do
            archives+=("artifacts/release/hippo-$VERSION-$rid.tar.gz")
          done
          archives+=("artifacts/release/hippo-$VERSION-win-x64.zip")
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: would create release $TAG titled \"hippo $VERSION\" (prerelease: $PRERELEASE) with:"
            printf '  %s\n' "${archives[@]}"
            echo "and these notes:"
            cat artifacts/release-notes.md
            exit 0
          fi
          gh release create "$TAG" --title "hippo $VERSION" --notes-file artifacts/release-notes.md \
            --target "$GITHUB_SHA" ${flags[@]+"${flags[@]}"} "${archives[@]}"

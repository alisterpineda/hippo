name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this whole pipeline and publishes the packages and binaries it uploads.
  workflow_call:
    inputs:
      version:
        description: The version to build, from the release tag; empty keeps Version in Directory.Build.props
        type: string
        default: ''

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # MSBuild reads environment variables as properties, so every build, pack and test below, and each
  # `dotnet msbuild -getProperty:Version`, takes the release's version from here. Empty outside a release.
  HippoReleaseVersion: ${{ inputs.version }}

jobs:
  test:
    # Paths, file times and permissions differ by OS, so the in-process tests run on each one. The E2E tests run in the
    # native job, against each native binary.
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Only the projects this job tests: building E2E would publish a native AOT binary nothing here runs.
      - name: Build
        shell: bash
        run: |
          dotnet build tests/Hippo.Tests.Unit -c Release
          dotnet build tests/Hippo.Tests.Integration -c Release

      - name: Unit tests
        run: dotnet test tests/Hippo.Tests.Unit -c Release --no-build

      - name: Integration tests
        run: dotnet test tests/Hippo.Tests.Integration -c Release --no-build

  native:
    # Native AOT cannot cross-compile between operating systems, so each native tool package is packed and tested on
    # its own OS. The musl package is built in an Alpine container: the CLI picks linux-x64 on a musl system that has no
    # package of its own, and that binary, linked against glibc, does not run there.
    name: Native (${{ matrix.rid }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # One entry per native RID in ToolPackageRuntimeIdentifiers in src/Hippo/Hippo.csproj. `exe` is the binary in the
        # package; `command` is what the install puts on the tool path, a symlink to it or, on Windows, a .cmd file that
        # calls it.
        include:
          - os: macos-latest
            rid: osx-arm64
            exe: hippo
            command: hippo
          - os: macos-15-intel
            rid: osx-x64
            exe: hippo
            command: hippo
          # Pinned, not ubuntu-latest: the binary links against this image's glibc, and the README gives that
          # version as the oldest the binary runs on. Moving the image can raise it, so move it on purpose.
          - os: ubuntu-24.04
            rid: linux-x64
            exe: hippo
            command: hippo
          - os: ubuntu-latest
            container: mcr.microsoft.com/dotnet/sdk:10.0-alpine
            rid: linux-musl-x64
            exe: hippo
            command: hippo
          - os: windows-latest
            rid: win-x64
            exe: hippo.exe
            command: hippo.cmd
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    steps:
      # The native AOT prerequisites, bash for the steps below, and git, which checkout and the E2E tests use.
      - name: Install Alpine packages
        if: matrix.container != ''
        run: apk add --no-cache bash clang build-base zlib-dev git

      - uses: actions/checkout@v5

      # The SDK image carries the SDK.
      - uses: actions/setup-dotnet@v5
        if: matrix.container == ''
        with:
          global-json-file: global.json

      # PublishDir puts the published binary where the hippo-<rid> upload below reads it. In a container job,
      # github.workspace is the runner's path, not the container's, so these steps read GITHUB_WORKSPACE instead.
      - name: Pack native tool package
        shell: bash
        run: dotnet pack src/Hippo -c Release -r ${{ matrix.rid }} -o artifacts/nupkg -p:PublishDir="$GITHUB_WORKSPACE/artifacts/publish/${{ matrix.rid }}/"

      # Without HIPPO_EXE, as a contributor runs them: the build publishes a native binary for this machine and the
      # tests run it. The pack above has already compiled hippo for this RID, so the publish reuses its native compile and link.
      - name: Test as a local run does
        run: dotnet test tests/Hippo.Tests.E2E -c Release

      # The README gives 2.38 as the oldest glibc the linux-x64 binary runs on, set by the runner image it links against.
      - name: Check the glibc the binary needs
        if: matrix.rid == 'linux-x64'
        run: |
          needed=$(objdump -T artifacts/publish/linux-x64/hippo | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "$needed"
          if [ "$(printf '%s\n' "$needed" GLIBC_2.38 | sort -V | tail -1)" != GLIBC_2.38 ]; then
            echo "::error::The binary needs $needed, newer than the 2.38 the README gives."
            exit 1
          fi

      # The package users install names the native package for each RID; the install below picks this OS's.
      - name: Pack the package users install
        run: dotnet pack src/Hippo -c Release -o artifacts/nupkg

      - name: Install tool from local feed
        shell: bash
        run: |
          version=$(dotnet msbuild src/Hippo -getProperty:Version | tr -d '\r')
          dotnet tool install hippo --tool-path artifacts/tool --configfile local-feed.nuget.config --version "$version"
          output=$(artifacts/tool/${{ matrix.command }} --version | tr -d '\r')
          echo "$output"
          test "$output" = "$version"
          echo "HIPPO_VERSION=$version" >> "$GITHUB_ENV"

      # SQLite is linked into the binary, so the tests below pass only if that link works.
      - name: Check no SQLite library ships beside the binary
        shell: bash
        run: |
          if find artifacts/tool -iname '*sqlite*' | grep .; then
            echo "::error::A SQLite library was packed beside the binary."
            exit 1
          fi

      # The tests run the binary in the tool store rather than the command: a .cmd file would put cmd.exe's argument
      # parsing between them and hippo.
      - name: Test the installed binary
        shell: bash
        run: |
          export HIPPO_EXE="$GITHUB_WORKSPACE/artifacts/tool/.store/hippo/$HIPPO_VERSION/hippo.${{ matrix.rid }}/$HIPPO_VERSION/tools/any/${{ matrix.rid }}/${{ matrix.exe }}"
          test -f "$HIPPO_EXE"
          dotnet test tests/Hippo.Tests.E2E -c Release

      - uses: actions/upload-artifact@v7
        with:
          name: hippo-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: tool-package-${{ matrix.rid }}
          path: artifacts/nupkg/hippo.${{ matrix.rid }}.*.nupkg

  tool-package:
    # Packs the package users install and the framework-dependent package for platforms without a native one, and
    # uploads them with the native packages as one feed.
    name: Tool package
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          pattern: tool-package-*
          path: artifacts/nupkg
          merge-multiple: true

      - name: Pack the package users install
        run: dotnet pack src/Hippo -c Release -o artifacts/nupkg

      - name: Pack framework-dependent tool package
        run: dotnet pack src/Hippo -c Release -r any -p:PublishAot=false -o artifacts/nupkg

      # The CLI picks the framework-dependent package only on a platform without a native one, so this install goes
      # through a copy of the package users install that names no native packages. The copied config resolves its
      # `artifacts/nupkg` feed relative to itself, hence the nested artifacts/any/artifacts/nupkg.
      - name: Install framework-dependent tool from local feed
        run: |
          version=$(dotnet msbuild src/Hippo -getProperty:Version)
          mkdir -p artifacts/any/artifacts/nupkg
          cp local-feed.nuget.config artifacts/any/
          cp artifacts/nupkg/hippo.any.$version.nupkg artifacts/any/artifacts/nupkg/
          dotnet pack src/Hippo -c Release -p:ToolPackageRuntimeIdentifiers=any -o artifacts/any/artifacts/nupkg
          dotnet tool install hippo --tool-path artifacts/any/tool --configfile artifacts/any/local-feed.nuget.config --version "$version"
          output=$(artifacts/any/tool/hippo --version)
          echo "$output"
          test "$output" = "$version"

      - name: Test the framework-dependent tool
        run: dotnet test tests/Hippo.Tests.E2E -c Release
        env:
          HIPPO_EXE: ${{ github.workspace }}/artifacts/any/tool/hippo

      - uses: actions/upload-artifact@v7
        with:
          name: tool-package
          path: artifacts/nupkg/

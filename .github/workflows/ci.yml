name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    # Paths, file times and permissions differ by OS, so the in-process tests run on each one. The E2E tests run in the
    # native job, against each native binary.
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Unit tests
        run: dotnet test tests/Hippo.Tests.Unit -c Release --no-build

      - name: Integration tests
        run: dotnet test tests/Hippo.Tests.Integration -c Release --no-build

  tool-package:
    # Packs the framework-dependent tool package, which runs on any OS.
    name: Tool package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Pack tool package
        run: dotnet pack src/Hippo -c Release -o artifacts/nupkg

      - name: Install tool package from local feed
        run: |
          version=$(dotnet msbuild src/Hippo -getProperty:Version)
          dotnet tool install hippo --tool-path artifacts/tool --add-source artifacts/nupkg --version "$version"
          output=$(artifacts/tool/hippo --version)
          echo "$output"
          test "$output" = "$version"

      - uses: actions/upload-artifact@v7
        with:
          name: tool-package
          path: artifacts/nupkg/

  native:
    # Native AOT cannot cross-compile between operating systems, so each binary is built and tested on its own OS.
    name: Native (${{ matrix.rid }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            exe: hippo
          - os: macos-15-intel
            rid: osx-x64
            exe: hippo
          - os: ubuntu-latest
            rid: linux-x64
            exe: hippo
          - os: windows-latest
            rid: win-x64
            exe: hippo.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish native AOT binary
        run: dotnet publish src/Hippo -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o artifacts/publish/${{ matrix.rid }}

      # SQLite is linked into the binary, so the tests below pass only if that link works.
      - name: Check no SQLite library ships beside the binary
        shell: bash
        run: |
          if ls artifacts/publish/${{ matrix.rid }} | grep -i sqlite; then
            echo "::error::A SQLite library was published beside the binary."
            exit 1
          fi

      - name: Test the published binary
        run: dotnet test tests/Hippo.Tests.E2E -c Release
        env:
          HIPPO_EXE: ${{ github.workspace }}/artifacts/publish/${{ matrix.rid }}/${{ matrix.exe }}

      - uses: actions/upload-artifact@v7
        with:
          name: hippo-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}/

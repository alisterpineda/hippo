name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this whole pipeline and publishes the packages and binaries it uploads.
  workflow_call:
    inputs:
      version:
        description: The version to build, from the release tag; empty keeps Version in Directory.Build.props
        type: string
        default: ''

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # MSBuild reads environment variables as properties, so every build, pack and test below, and each
  # `dotnet msbuild -getProperty:Version`, takes the release's version from here. Empty outside a release.
  HippoReleaseVersion: ${{ inputs.version }}

jobs:
  test:
    # Paths, file times and permissions differ by OS, so the in-process tests run on each one. The E2E tests run in the
    # native job, against each native binary.
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # The script is the same on every OS, so one lint is enough; the Ubuntu image ships shellcheck.
      - name: Lint the install script
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck install.sh

      # The same for install.ps1 with PSScriptAnalyzer, which the Windows image ships. Write-Host is how a script run by
      # `irm | iex` talks to the user without its output landing in the pipeline, so that rule is off.
      - name: Lint the install script
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path install.ps1 -ExcludeRule PSAvoidUsingWriteHost -EnableExit

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Only the projects this job tests: building E2E would publish a native AOT binary nothing here runs.
      - name: Build
        shell: bash
        run: |
          dotnet build tests/Hippo.Tests.Unit -c Release
          dotnet build tests/Hippo.Tests.Integration -c Release

      - name: Unit tests
        run: dotnet test tests/Hippo.Tests.Unit -c Release --no-build

      - name: Integration tests
        run: dotnet test tests/Hippo.Tests.Integration -c Release --no-build

  native:
    # Native AOT cannot cross-compile between operating systems, so each native tool package is packed and tested on
    # its own OS. The musl package is built in an Alpine container: the CLI picks linux-x64 on a musl system that has no
    # package of its own, and that binary, linked against glibc, does not run there. The release archive is made here
    # too, once the binary has passed its tests, on the OS that built it.
    name: Native (${{ matrix.rid }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # One entry per native RID in ToolPackageRuntimeIdentifiers in src/Hippo/Hippo.csproj. `exe` is the binary in the
        # package; `command` is what the install puts on the tool path, a symlink to it or, on Windows, a .cmd file that
        # calls it; `archive` is the release archive's format, which the publish job in release.yml expects.
        include:
          - os: macos-latest
            rid: osx-arm64
            exe: hippo
            command: hippo
            archive: tar.gz
          - os: macos-15-intel
            rid: osx-x64
            exe: hippo
            command: hippo
            archive: tar.gz
          # Pinned, not ubuntu-latest: the binary links against this image's glibc, and the README and install.sh
          # give that version as the oldest the binary runs on. Moving the image can raise it, so move it on purpose.
          - os: ubuntu-24.04
            rid: linux-x64
            exe: hippo
            command: hippo
            archive: tar.gz
          - os: ubuntu-latest
            container: mcr.microsoft.com/dotnet/sdk:10.0-alpine
            rid: linux-musl-x64
            exe: hippo
            command: hippo
            archive: tar.gz
          - os: windows-latest
            rid: win-x64
            exe: hippo.exe
            command: hippo.cmd
            archive: zip
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    steps:
      # The native AOT prerequisites, bash for the steps below, git, which checkout and the E2E tests use, and curl and
      # python3 for the install script's test: the script downloads with curl, and python3 serves it the archive.
      - name: Install Alpine packages
        if: matrix.container != ''
        run: apk add --no-cache bash clang build-base zlib-dev git curl python3

      - uses: actions/checkout@v5

      # The SDK image carries the SDK.
      - uses: actions/setup-dotnet@v5
        if: matrix.container == ''
        with:
          global-json-file: global.json

      # PublishDir puts the published binary where the archive steps below read it. In a container job,
      # github.workspace is the runner's path, not the container's, so these steps read GITHUB_WORKSPACE instead.
      - name: Pack native tool package
        shell: bash
        run: dotnet pack src/Hippo -c Release -r ${{ matrix.rid }} -o artifacts/nupkg -p:PublishDir="$GITHUB_WORKSPACE/artifacts/publish/${{ matrix.rid }}/"

      # Without HIPPO_EXE, as a contributor runs them: the build publishes a native binary for this machine and the
      # tests run it. The pack above has already compiled hippo for this RID, so the publish reuses its native compile and link.
      - name: Test as a local run does
        run: dotnet test tests/Hippo.Tests.E2E -c Release

      # The README gives 2.38 as the oldest glibc the linux-x64 binary runs on, set by the runner image it links against,
      # and install.sh refuses an older one; a change to the floor changes both.
      - name: Check the glibc the binary needs
        if: matrix.rid == 'linux-x64'
        run: |
          needed=$(objdump -T artifacts/publish/linux-x64/hippo | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "$needed"
          if [ "$(printf '%s\n' "$needed" GLIBC_2.38 | sort -V | tail -1)" != GLIBC_2.38 ]; then
            echo "::error::The binary needs $needed, newer than the 2.38 the README gives."
            exit 1
          fi

      # The package users install names the native package for each RID; the install below picks this OS's.
      - name: Pack the package users install
        run: dotnet pack src/Hippo -c Release -o artifacts/nupkg

      - name: Install tool from local feed
        shell: bash
        run: |
          version=$(dotnet msbuild src/Hippo -getProperty:Version | tr -d '\r')
          dotnet tool install hippo --tool-path artifacts/tool --configfile local-feed.nuget.config --version "$version"
          output=$(artifacts/tool/${{ matrix.command }} --version | tr -d '\r')
          echo "$output"
          # The version, then the commit it was built from: 0.1.0+d9d09f6. In an `if`, since under set -e the macOS
          # runners' bash 3.2 carries on past a failing `[[ ]]`.
          if ! [[ "$output" =~ ^"$version"\+[0-9a-f]{7}$ ]]; then
            echo "::error::The installed tool printed '$output', not $version+<commit>."
            exit 1
          fi
          echo "HIPPO_VERSION=$version" >> "$GITHUB_ENV"

      # SQLite is linked into the binary, so the tests below pass only if that link works.
      - name: Check no SQLite library ships beside the binary
        shell: bash
        run: |
          if find artifacts/tool -iname '*sqlite*' | grep .; then
            echo "::error::A SQLite library was packed beside the binary."
            exit 1
          fi

      # The tests run the binary in the tool store rather than the command: a .cmd file would put cmd.exe's argument
      # parsing between them and hippo.
      - name: Test the installed binary
        shell: bash
        run: |
          export HIPPO_EXE="$GITHUB_WORKSPACE/artifacts/tool/.store/hippo/$HIPPO_VERSION/hippo.${{ matrix.rid }}/$HIPPO_VERSION/tools/any/${{ matrix.rid }}/${{ matrix.exe }}"
          test -f "$HIPPO_EXE"
          dotnet test tests/Hippo.Tests.E2E -c Release

      # The archive holds the binary alone, at its root, so unpacking it gives the command directly. tar keeps the
      # binary's mode; COPYFILE_DISABLE stops macOS tar adding a ._hippo AppleDouble entry beside it.
      - name: Archive the binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          COPYFILE_DISABLE: 1
        run: |
          mkdir -p artifacts/release
          tar -czf "artifacts/release/hippo-$HIPPO_VERSION-${{ matrix.rid }}.tar.gz" -C "artifacts/publish/${{ matrix.rid }}" ${{ matrix.exe }}

      - name: Archive the binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Compress-Archive -Path artifacts/publish/${{ matrix.rid }}/${{ matrix.exe }} -DestinationPath "artifacts/release/hippo-$env:HIPPO_VERSION-${{ matrix.rid }}.zip"

      # install.sh installs the archive as a user would, from a local server laid out as a release is. The server runs
      # in this step because one started in a step is not guaranteed to outlive it. Not tested here, since both need a
      # published release: the latest-release lookup, and the HTTPS download from GitHub that HIPPO_DOWNLOAD_BASE
      # replaces. Both are checked by hand after a release.
      #
      # The checks use `case` and `if`, not `[[ ]]`: under set -e, the macOS runners' bash 3.2 carries on past a
      # failing `[[ ]]`.
      - name: Install from the archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          archive=hippo-$HIPPO_VERSION-${{ matrix.rid }}.tar.gz
          serve=artifacts/serve/v$HIPPO_VERSION
          mkdir -p "$serve"
          cp "artifacts/release/$archive" "$serve/"
          # macOS has shasum; Linux has sha256sum. Both write the same format.
          if command -v sha256sum >/dev/null; then sha256=sha256sum; else sha256='shasum -a 256'; fi
          sum=$(cd "$serve" && $sha256 "$archive")
          hash=${sum%% *}
          # SHA256SUMS as the release has it, a line per archive, with this archive's line neither first nor last.
          # With no argument, it has no line for this archive.
          write_sums() {
            {
              echo "$(printf '%064d' 0)  hippo-$HIPPO_VERSION-other-x64.tar.gz"
              if [ -n "${1:-}" ]; then echo "$1  $archive"; fi
              echo "$(printf '%064d' 0)  hippo-$HIPPO_VERSION-win-x64.zip"
            } > "$serve/SHA256SUMS"
            cat "$serve/SHA256SUMS"
          }
          write_sums "$hash"

          python3 -m http.server 8000 --bind 127.0.0.1 --directory artifacts/serve &
          server=$!
          trap 'kill "$server"' EXIT
          for _ in {1..50}; do
            curl -fsS -o /dev/null "http://127.0.0.1:8000/v$HIPPO_VERSION/SHA256SUMS" 2>/dev/null && break
            sleep 0.2
          done

          export HIPPO_DOWNLOAD_BASE=http://127.0.0.1:8000
          installed=$GITHUB_WORKSPACE/artifacts/installed
          refused=$GITHUB_WORKSPACE/artifacts/refused

          check_version() {
            output=$("$installed/hippo" --version)
            case $output in
              "$HIPPO_VERSION+"*) ;;
              *) echo "::error::The installed hippo printed '$output', not $HIPPO_VERSION+<commit>."; exit 1 ;;
            esac
          }

          # Runs install.sh with the given variables, and checks that it fails with the given message and installs
          # nothing.
          check_refused() {
            message=$1
            shift
            if env HIPPO_INSTALL_DIR="$refused" "$@" sh install.sh 2> artifacts/refused.err; then
              echo "::error::install.sh succeeded with $*; it should have refused with: $message"
              exit 1
            fi
            cat artifacts/refused.err
            if ! grep -qF "$message" artifacts/refused.err; then
              echo "::error::install.sh failed without saying: $message"
              exit 1
            fi
            if [ -e "$refused/hippo" ]; then
              echo "::error::install.sh refused but installed $refused/hippo."
              exit 1
            fi
          }

          HIPPO_INSTALL_DIR=$installed sh install.sh
          check_version

          # A rerun is how a user updates, so it must replace the binary already there, here a stand-in, and accept
          # a version with a leading v. The stand-in is renamed over the binary, as install.sh does, because writing
          # into it can fail with "Text file busy" on Linux while a process still has it open to run.
          printf '#!/bin/sh\necho old\n' > "$installed/hippo.stand-in"
          chmod +x "$installed/hippo.stand-in"
          mv -f "$installed/hippo.stand-in" "$installed/hippo"
          HIPPO_INSTALL_DIR=$installed HIPPO_VERSION=v$HIPPO_VERSION sh install.sh
          check_version
          # The staging directory beside the binary is gone.
          if [ "$(ls -A "$installed")" != hippo ]; then
            echo "::error::$installed holds more than hippo: $(ls -A "$installed")"
            exit 1
          fi

          # A version with no release names the asset it looked for, since a typo in HIPPO_VERSION is the likely cause.
          check_refused "has no hippo-0.0.0-missing-${{ matrix.rid }}.tar.gz" HIPPO_VERSION=0.0.0-missing

          write_sums
          check_refused "has no line for $archive"

          # One changed digit in the published checksum must stop the install.
          case $hash in 0*) bad=1${hash#?} ;; *) bad=0${hash#?} ;; esac
          write_sums "$bad"
          check_refused "did not match the published checksum"

      # install.ps1 installs the zip as the step above installs a tarball, under both Windows PowerShell 5.1, where
      # `irm | iex` usually lands, and pwsh 7, run as a file and through `iex`. The server is stopped in a finally, in
      # this step, for the same reason, and the same two paths are left to a check by hand after a release.
      #
      # The script adds each install directory to the runner's user PATH, as it would a user's; the runner is discarded
      # with the job. A failing native command does not stop a pwsh step, so every run's exit code is checked.
      - name: Install from the archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $release = $env:HIPPO_VERSION
          $archive = "hippo-$release-${{ matrix.rid }}.zip"
          $serve = "artifacts/serve/v$release"
          New-Item -ItemType Directory -Force $serve | Out-Null
          Copy-Item "artifacts/release/$archive" $serve
          $hash = (Get-FileHash -Algorithm SHA256 "$serve/$archive").Hash.ToLowerInvariant()
          $bad = $(if ($hash.StartsWith('0')) { '1' } else { '0' }) + $hash.Substring(1)
          # SHA256SUMS as the release has it, a line per archive, with this archive's line neither first nor last, and
          # the LF line endings sha256sum writes. With no argument, it has no line for this archive.
          function Write-Sums($sum) {
            $zero = '0' * 64
            $lines = @("$zero  hippo-$release-other-x64.tar.gz")
            if ($sum) { $lines += "$sum  $archive" }
            $lines += "$zero  hippo-$release-osx-arm64.tar.gz"
            [IO.File]::WriteAllText((Join-Path $PWD "$serve/SHA256SUMS"), ($lines -join "`n") + "`n")
            Get-Content "$serve/SHA256SUMS"
          }

          # A release whose binary cannot start: its checksum matches, so only the script's own run of the binary can
          # stop it replacing the installed one.
          $broken = "hippo-0.0.0-broken-${{ matrix.rid }}.zip"
          New-Item -ItemType Directory -Force artifacts/serve/v0.0.0-broken, artifacts/broken | Out-Null
          Set-Content artifacts/broken/hippo.exe 'not a program'
          Compress-Archive -Force -Path artifacts/broken/hippo.exe -DestinationPath "artifacts/serve/v0.0.0-broken/$broken"
          $sum = (Get-FileHash -Algorithm SHA256 "artifacts/serve/v0.0.0-broken/$broken").Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD artifacts/serve/v0.0.0-broken/SHA256SUMS), "$sum  $broken`n")

          function Fail($message) {
            Write-Host "::error::$message"
            exit 1
          }

          # Runs install.ps1 under the given shell, as a file or, given a command, as that command runs it, and returns
          # its exit code. Its output is kept in artifacts/install.out and its errors in artifacts/install.err.
          function Invoke-Install($shell, $dir, $version, $command) {
            $previous = $env:HIPPO_INSTALL_DIR, $env:HIPPO_VERSION
            $env:HIPPO_INSTALL_DIR = $dir
            $env:HIPPO_VERSION = $version
            $run = if ($command) { '-Command', $command } else { '-File', 'install.ps1' }
            try {
              & $shell -NoProfile -ExecutionPolicy Bypass @run > artifacts/install.out 2> artifacts/install.err
              $code = $LASTEXITCODE
            } finally {
              $env:HIPPO_INSTALL_DIR, $env:HIPPO_VERSION = $previous
            }
            Get-Content artifacts/install.out, artifacts/install.err | Out-Host
            $code
          }

          function Assert-Installed($shell, $dir, $version = $release, $command) {
            $code = Invoke-Install $shell $dir $version $command
            if ($code -ne 0) { Fail "install.ps1 under $shell exited with $code." }
            $output = & "$dir/hippo.exe" --version
            if (-not "$output".StartsWith("$release+")) {
              Fail "The installed hippo printed '$output', not $release+<commit>."
            }
          }

          function Get-Hash($path) {
            if (Test-Path $path) { (Get-FileHash -Algorithm SHA256 $path).Hash }
          }

          # Checks that install.ps1 refuses with the given message and leaves the directory's hippo.exe as it was, or
          # absent. Run as a file, it must exit non-zero; through `iex`, the session must carry on past it.
          function Assert-Refused($shell, $dir, $message, $version = $release, $command) {
            $before = Get-Hash "$dir/hippo.exe"
            $code = Invoke-Install $shell $dir $version $command
            if ($command) {
              if (-not "$(Get-Content -Raw artifacts/install.out)".Contains('still-alive')) {
                Fail "install.ps1 through iex under $shell ended the session when it refused."
              }
            } elseif ($code -eq 0) {
              Fail "install.ps1 under $shell succeeded; it should have refused with: $message"
            }
            if (-not "$(Get-Content -Raw artifacts/install.err)".Contains($message)) {
              Fail "install.ps1 under $shell failed without saying: $message"
            }
            if ((Get-Hash "$dir/hippo.exe") -ne $before) { Fail "install.ps1 under $shell refused but changed $dir/hippo.exe." }
          }

          function Assert-Holds($dir, $expected) {
            $names = (Get-ChildItem -Force $dir | Sort-Object Name).Name -join ' '
            if ($names -ne $expected) { Fail "$dir holds $names, not $expected." }
          }

          # The user PATH as a new profile has it: REG_EXPAND_SZ, with an entry that names a variable. The script must
          # add to it without expanding that entry or changing the kind, and add each directory once.
          $key = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Environment')
          $seeded = @("$($key.GetValue('Path', '', 'DoNotExpandEnvironmentNames'))" -split ';' | Where-Object { $_ }) + '%SystemRoot%\hippo-ci'
          $key.SetValue('Path', $seeded -join ';', 'ExpandString')
          $key.Dispose()
          $added = @()

          $iex = 'Get-Content -Raw install.ps1 | Invoke-Expression'
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8000', '--bind', '127.0.0.1', '--directory', 'artifacts/serve' -NoNewWindow -PassThru
          try {
            Write-Sums $hash
            for ($i = 0; $i -lt 50; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8000/v$release/SHA256SUMS" | Out-Null
                break
              } catch {
                Start-Sleep -Milliseconds 200
              }
            }
            $env:HIPPO_DOWNLOAD_BASE = 'http://127.0.0.1:8000'

            foreach ($shell in 'powershell', 'pwsh') {
              $installed = "$env:GITHUB_WORKSPACE/artifacts/installed-$shell"
              $iexed = "$env:GITHUB_WORKSPACE/artifacts/iex-$shell"
              $refused = "$env:GITHUB_WORKSPACE/artifacts/refused-$shell"
              $added += [IO.Path]::GetFullPath($installed), [IO.Path]::GetFullPath($iexed)
              Write-Sums $hash
              Assert-Installed $shell $installed

              # A rerun is how a user updates, so it must replace the binary already there, here a stand-in, and
              # accept a version with a leading v.
              Set-Content "$installed/hippo.exe" 'stand-in'
              Assert-Installed $shell $installed "v$release"
              # Nothing the script unpacked is left beside the binary.
              Assert-Holds $installed hippo.exe

              # Windows renames a running exe but will not overwrite it, so a rerun moves it aside to hippo.exe.old. A
              # handle that shares reading and renaming, but not writing, holds the binary as a running hippo does.
              $held = [IO.File]::Open("$installed/hippo.exe", 'Open', 'Read', 'Read, Delete')
              try {
                Assert-Installed $shell $installed
              } finally {
                $held.Close()
              }
              Assert-Holds $installed 'hippo.exe hippo.exe.old'
              # Once nothing holds it, the next run deletes it.
              Assert-Installed $shell $installed
              Assert-Holds $installed hippo.exe

              Assert-Refused $shell $installed 'did not run on this system' 0.0.0-broken

              # `irm | iex` runs the script in the user's session, where hippo must then run by name.
              Assert-Installed $shell $iexed -command "$iex; (Get-Command hippo).Source"
              $found = @(Get-Content artifacts/install.out)[-1]
              if ($found -ne [IO.Path]::GetFullPath("$iexed/hippo.exe")) {
                Fail "After install.ps1 through iex under $shell, hippo runs $found, not $iexed/hippo.exe."
              }

              # A version with no release names the asset it looked for, since a typo in HIPPO_VERSION is the likely
              # cause.
              Assert-Refused $shell $refused "has no hippo-0.0.0-missing-${{ matrix.rid }}.zip" 0.0.0-missing

              Write-Sums
              Assert-Refused $shell $refused "has no line for $archive"

              # One changed digit in the published checksum must stop the install.
              Write-Sums $bad
              Assert-Refused $shell $refused 'did not match the published checksum'
              # Through iex, exit would close the user's terminal, so a refusal must leave the session running.
              Assert-Refused $shell $refused 'did not match the published checksum' -command "$iex; 'still-alive'"
            }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }

          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $kind = $key.GetValueKind('Path')
          $entries = @($key.GetValue('Path', '', 'DoNotExpandEnvironmentNames') -split ';')
          $key.Dispose()
          if ($kind -ne 'ExpandString') { Fail "The user PATH is $kind after the installs, not ExpandString." }
          foreach ($entry in $seeded) {
            if ($entry -notin $entries) { Fail "The installs dropped or changed '$entry' in the user PATH: $($entries -join ';')" }
          }
          foreach ($dir in $added) {
            $count = @($entries | Where-Object { $_ -eq $dir }).Count
            if ($count -ne 1) { Fail "The user PATH holds $dir $count times, not once: $($entries -join ';')" }
          }

          # GitHub ends a pwsh step with `exit $LASTEXITCODE`, which the last refusal left at 1.
          exit 0

      # The archive, which the publish job in release.yml attaches to the release.
      - uses: actions/upload-artifact@v7
        with:
          name: hippo-${{ matrix.rid }}
          path: artifacts/release/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: tool-package-${{ matrix.rid }}
          path: artifacts/nupkg/hippo.${{ matrix.rid }}.*.nupkg

  tool-package:
    # Packs the package users install and the framework-dependent package for platforms without a native one, and
    # uploads them with the native packages as one feed.
    name: Tool package
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          pattern: tool-package-*
          path: artifacts/nupkg
          merge-multiple: true

      - name: Pack the package users install
        run: dotnet pack src/Hippo -c Release -o artifacts/nupkg

      - name: Pack framework-dependent tool package
        run: dotnet pack src/Hippo -c Release -r any -p:PublishAot=false -o artifacts/nupkg

      # The CLI picks the framework-dependent package only on a platform without a native one, so this install goes
      # through a copy of the package users install that names no native packages. The copied config resolves its
      # `artifacts/nupkg` feed relative to itself, hence the nested artifacts/any/artifacts/nupkg.
      - name: Install framework-dependent tool from local feed
        run: |
          version=$(dotnet msbuild src/Hippo -getProperty:Version)
          mkdir -p artifacts/any/artifacts/nupkg
          cp local-feed.nuget.config artifacts/any/
          cp artifacts/nupkg/hippo.any.$version.nupkg artifacts/any/artifacts/nupkg/
          dotnet pack src/Hippo -c Release -p:ToolPackageRuntimeIdentifiers=any -o artifacts/any/artifacts/nupkg
          dotnet tool install hippo --tool-path artifacts/any/tool --configfile artifacts/any/local-feed.nuget.config --version "$version"
          output=$(artifacts/any/tool/hippo --version)
          echo "$output"
          [[ "$output" =~ ^"$version"\+[0-9a-f]{7}$ ]]

      - name: Test the framework-dependent tool
        run: dotnet test tests/Hippo.Tests.E2E -c Release
        env:
          HIPPO_EXE: ${{ github.workspace }}/artifacts/any/tool/hippo

      - uses: actions/upload-artifact@v7
        with:
          name: tool-package
